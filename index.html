<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview Card</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; padding: 32px 16px; }
      .card { max-width: 440px; margin: 0 auto; padding: 28px 32px; border-radius: 20px; background: #fff; box-shadow: 0 20px 60px -30px rgba(15,23,42,.18); }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
      p { font-size: .9375rem; line-height: 1.7; color: #475569; }
      .badge { display: inline-block; margin-top: 16px; padding: 4px 12px; border-radius: 999px; background: #eef2ff; color: #3b5bdb; font-size: .75rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>HTML Viewer</h1>
      <p>Edit this code in the panel on the left and watch the preview update instantly.</p>
      <span class="badge">Sandboxed Preview</span>
    </div>
  </body>
</html>
